[package]
name = "lenso-capability-support-intake"
version = "0.1.1"
description = "Portable external-channel intake Capability for Lenso Support Case providers."
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
include = ["capability.json", "schemas/*.json", "src/*.rs"]

[package.metadata.lenso.contract]
descriptor = "capability.json"
projection = "rust"
output = "src/generated.rs"

[dependencies]
futures.workspace = true
lenso-contract-runtime.workspace = true
lenso-kernel.workspace = true
lenso-plugin-authoring.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
